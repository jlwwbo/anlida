<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安粒达 · 结构图</title>
<meta name="description" content="19 个零件的可交互白模：选一个用药画像装进去，看它占几个槽、能用多久，再看一次取药的六个动作。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/structure.css">
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/jsm/"}}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div class="frame" aria-hidden="true"><b></b><b></b><b></b><b></b></div>

<header class="brand">
  <a class="brand__back mono" href="./">← 安粒达</a>
  <p class="brand__t mono">破板取药机构 · 交互结构图</p>
</header>

<section class="who" aria-label="用药画像">
  <p class="lbl mono">装谁的药</p>
  <div class="who__chips" id="chips"></div>
  <div class="who__card" id="whoCard"></div>
</section>

<aside class="side">
  <div class="card" id="card" aria-live="polite"></div>
  <nav class="rail" aria-label="一次取药的时序">
    <p class="lbl mono">一次取药 · 六个动作</p>
    <div id="rail"></div>
    <p class="note" id="phaseNote"></p>
  </nav>
</aside>

<section class="sheet" id="sheet" hidden>
  <button class="sheet__x mono" id="sheetClose" aria-label="收起">关闭</button>
  <p class="lbl mono">19 个零件</p>
  <div id="legend"></div>
</section>

<div class="dock">
  <button id="play" class="btn"><em></em><span>暂停</span></button>
  <label class="sl sl--scrub"><span class="mono">时序</span><input id="scrub" type="range" min="0" max="1000" value="0"></label>
  <div class="seg" role="group" aria-label="拆开程度">
    <span class="mono lbl lbl--in">拆开</span>
    <button data-x="0" data-on="1">0</button><button data-x="0.5">50</button><button data-x="1">100</button>
  </div>
  <button id="load" class="btn"><span>装填演示</span></button>
  <button id="shell" class="btn btn--ghost"><span>外壳</span></button>
  <button id="parts" class="btn"><span>零件</span></button>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
